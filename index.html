<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פתיחת שנה תשפ״ז</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@300;400;600;700&display=swap">

<style>
  :root{
    --ink:#0F1E36;
    --blue:#1D4E89;
    --blue-soft:#4A7BB7;
    --gold:#C08A22;
    --gold-lit:#E9C56A;

    --ground:#F2F5FA;
    --surface:#FFFFFF;
    --rule:#D8E0EC;
    --text:#0F1E36;
    --text-dim:#4C5C74;
    --initial-ink:#1D4E89;
    --band-1:#12294A;
    --band-2:#1D4E89;

    --display:"Frank Ruhl Libre",'Times New Roman',serif;
    --body:"Assistant","Segoe UI",Arial,sans-serif;

    --step-0:1rem;
    --step-1:1.15rem;
    --step-2:1.5rem;
    --step-3:2.1rem;
    --step-4:clamp(2.4rem,6vw,3.6rem);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0B1626;
      --surface:#132239;
      --rule:#25374F;
      --text:#E8EEF7;
      --text-dim:#9AACC4;
      --initial-ink:#9CC2EE;
      --band-1:#081221;
      --band-2:#14355E;
    }
  }

  :root[data-theme="dark"]{
    --ground:#0B1626;
    --surface:#132239;
    --rule:#25374F;
    --text:#E8EEF7;
    --text-dim:#9AACC4;
    --initial-ink:#9CC2EE;
    --band-1:#081221;
    --band-2:#14355E;
  }

  *,*::before,*::after{box-sizing:border-box;}

  /* the host paints its own ground behind the page; claim it explicitly */
  body{background:var(--ground);}

  .page{
    direction:rtl;
    background:var(--ground);
    color:var(--text);
    font-family:var(--body);
    font-size:var(--step-0);
    line-height:1.65;
    min-height:100vh;
    padding:clamp(28px,5vw,64px) clamp(16px,4vw,32px) 64px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(40px,6vw,64px);
  }

  .shell{width:100%;max-width:880px;display:flex;flex-direction:column;gap:clamp(40px,6vw,64px);}

  /* ---- hero ---- */
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;}

  .eyebrow{
    font-size:.78rem;
    letter-spacing:.08em;
    color:var(--gold);
    font-weight:700;
  }

  .hero h1{
    font-family:var(--display);
    font-weight:900;
    font-size:var(--step-4);
    line-height:1.12;
    margin:0;
    text-wrap:balance;
    color:var(--text);
  }
  .hero h1 em{font-style:normal;color:var(--gold);}

  .lede{
    margin:0;
    max-width:34ch;
    color:var(--text-dim);
    font-size:var(--step-1);
    font-weight:300;
  }

  /* ---- countdown ---- */
  .countdown{
    background:linear-gradient(160deg,var(--band-1),var(--band-2));
    border-radius:18px;
    padding:clamp(26px,4vw,38px) clamp(18px,4vw,34px) clamp(22px,3vw,30px);
    box-shadow:0 18px 40px rgba(15,30,54,.22);
    position:relative;
    overflow:hidden;
  }
  /* the dawn: a low band of light along the horizon */
  .countdown::after{
    content:"";
    position:absolute;
    inset:auto 0 0 0;
    height:64%;
    background:radial-gradient(120% 100% at 50% 118%, rgba(233,197,106,.34) 0%, rgba(233,197,106,.10) 42%, transparent 72%);
    pointer-events:none;
  }

  .cd-label{
    position:relative;z-index:1;
    text-align:center;
    color:var(--gold-lit);
    font-size:.85rem;
    letter-spacing:.06em;
    font-weight:600;
    margin-bottom:22px;
  }

  .units{
    position:relative;z-index:1;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:clamp(6px,2vw,20px);
    border-top:1px solid rgba(233,197,106,.30);
    padding-top:20px;
  }

  .unit{display:flex;flex-direction:column;align-items:center;gap:6px;}

  .num{
    font-family:var(--display);
    font-weight:700;
    font-variant-numeric:tabular-nums;
    font-size:clamp(1.9rem,7vw,3.1rem);
    line-height:1;
    color:#FFF6E2;
    letter-spacing:.01em;
  }

  .unit-name{
    font-size:clamp(.68rem,2.4vw,.82rem);
    letter-spacing:.1em;
    color:rgba(233,197,106,.86);
    font-weight:600;
  }

  .arrived{
    position:relative;z-index:1;
    text-align:center;
    font-family:var(--display);
    font-size:var(--step-2);
    color:#FFF6E2;
    margin:6px 0 0;
  }

  /* ---- children ---- */
  .roster{display:flex;flex-direction:column;gap:22px;}

  .roster-head{display:flex;align-items:baseline;gap:14px;}
  .roster-head h2{
    font-family:var(--display);
    font-weight:700;
    font-size:var(--step-2);
    margin:0;
    color:var(--text);
    white-space:nowrap;
  }
  .roster-head .line{flex:1;height:1px;background:var(--rule);}

  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
    gap:16px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:26px 18px 22px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:var(--gold);
    box-shadow:0 14px 28px rgba(15,30,54,.14);
  }

  .initial{
    width:56px;height:56px;
    border-radius:50%;
    display:grid;place-items:center;
    font-family:var(--display);
    font-weight:700;
    font-size:1.5rem;
    color:var(--initial-ink);
    background:transparent;
    box-shadow:inset 0 0 0 1.5px var(--gold);
  }

  .card h3{
    font-family:var(--display);
    font-weight:700;
    font-size:var(--step-1);
    margin:0;
    color:var(--text);
  }
  .card p{margin:0;font-size:.88rem;color:var(--text-dim);font-weight:300;}

  footer{
    text-align:center;
    color:var(--text-dim);
    font-size:.82rem;
    border-top:1px solid var(--rule);
    padding-top:20px;
  }
  footer strong{color:var(--gold);font-weight:600;}

  /* ---- entrance ---- */
  .rise{opacity:0;transform:translateY(14px);animation:rise .7s cubic-bezier(.2,.7,.3,1) forwards;}
  .rise:nth-child(2){animation-delay:.09s;}
  .rise:nth-child(3){animation-delay:.18s;}
  @keyframes rise{to{opacity:1;transform:none;}}

  @media (prefers-reduced-motion: reduce){
    .rise{animation:none;opacity:1;transform:none;}
    .card{transition:none;}
  }
</style>

</head>
<body>
<div class="page">
  <div class="shell">

    <header class="hero rise">
      <span class="eyebrow">משפחת טובי</span>
      <h1>פתיחת שנה <em>תשפ״ז</em></h1>
      <p class="lede">סופרים יחד את הימים עד הבוקר הראשון של שנת הלימודים.</p>
    </header>

    <section class="countdown rise" aria-labelledby="cd-label">
      <div class="cd-label" id="cd-label">עד 1 בספטמבר 2026</div>
      <div class="units" id="units">
        <div class="unit"><span class="num" id="days">—</span><span class="unit-name">ימים</span></div>
        <div class="unit"><span class="num" id="hours">—</span><span class="unit-name">שעות</span></div>
        <div class="unit"><span class="num" id="minutes">—</span><span class="unit-name">דקות</span></div>
        <div class="unit"><span class="num" id="seconds">—</span><span class="unit-name">שניות</span></div>
      </div>
      <p class="arrived" id="arrived" hidden>הבוקר הראשון הגיע. שנה טובה!</p>
    </section>

    <section class="roster rise">
      <div class="roster-head">
        <h2>ארבעתנו</h2>
        <span class="line"></span>
      </div>
      <div class="cards">
        <article class="card"><span class="initial" aria-hidden="true">ל</span><h3>ליאור</h3><p>מתרגשים לקראתך</p></article>
        <article class="card"><span class="initial" aria-hidden="true">נ</span><h3>נריה</h3><p>מתרגשים לקראתך</p></article>
        <article class="card"><span class="initial" aria-hidden="true">ר</span><h3>רון</h3><p>מתרגשים לקראתך</p></article>
        <article class="card"><span class="initial" aria-hidden="true">ה</span><h3>הדר</h3><p>מתרגשים לקראתך</p></article>
      </div>
    </section>

    <footer><strong>משפחת טובי</strong> · שנת הלימודים תשפ״ז</footer>

  </div>
</div>

<script>
  (function(){
    var target = new Date(2026, 8, 1, 0, 0, 0); // 1 Sep 2026, viewer's local time
    var els = {
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      seconds: document.getElementById('seconds')
    };
    var units = document.getElementById('units');
    var arrived = document.getElementById('arrived');
    var timer;

    function pad(n){ return String(n).padStart(2,'0'); }

    function tick(){
      var diff = target - new Date();

      if (diff <= 0){
        units.hidden = true;
        arrived.hidden = false;
        clearInterval(timer);
        return;
      }

      var s = Math.floor(diff / 1000);
      els.days.textContent    = pad(Math.floor(s / 86400));
      els.hours.textContent   = pad(Math.floor(s / 3600) % 24);
      els.minutes.textContent = pad(Math.floor(s / 60) % 60);
      els.seconds.textContent = pad(s % 60);
    }

    tick();
    timer = setInterval(tick, 1000);
  })();
</script>

</body>
</html>
